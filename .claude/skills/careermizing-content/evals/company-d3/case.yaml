schema_version: "1.1"
name: company-d3
expected_outcome: |
  D-3 형식(표지 → 문항별 점검 포인트 2~4장 → CTA)으로, 각 본문 장이 "확인형 헤드라인 + 구조 카드 + BEFORE/AFTER 또는 예시 + 한 줄 팁"을 갖춘다.
  현대모비스 CI(네이비 #003866·시안 #00A8D1)는 라벨/pill/배너 포인트로만 쓰고 배경은 흰색 계열이다. 캔버스 1080×1350.
  마감 시각이 표기되고, 공식 공고 확인이 필요한 항목은 "확인 필요"로 표시한다. JSON 스펙은 render_carousel.py 형식을 따른다.
