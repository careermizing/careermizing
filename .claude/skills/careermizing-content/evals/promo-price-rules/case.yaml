schema_version: "1.1"
name: promo-price-rules
expected_outcome: |
  "선착순" 문구는 현행 규칙상 금지이므로 쓰지 않고 그 이유를 한 줄로 알린 뒤, 기간·조건 기반 긴급성으로 대체한다.
  가격은 "Max 1개월 49,000원 / 6개월 176,400원(월 정가 49,000×6 = 294,000원 대비 40%)" 형식을 따르되 게시 당일 가격 페이지 확인이 필요하다고 표시한다.
  캡션에 기존 활성 Max 고객 안내를 넣고, 전략집만 파는 행사처럼 쓰지 않는다. 8장 흐름(훅 → 근거 → 꼬리질문/인사이트 → 예시 → 상품 → 혜택 → CTA)과 NOTE(검수 메모)를 포함한다.
