schema_version: "1.1"
name: interview-tip-7p
expected_outcome: |
  7장 구조(질문 표지 → 약한 답변 → 이유/꼬리질문 → 답변 프레임 → 가상 답변 예시 → 주의 → 워크시트+CTA)로 장별 메인/서브/본문/결론이 있고,
  가상 답변 장에 "※ 이해를 돕기 위한 가상 답변입니다" 면책이 있으며, P1~P3에 제품명이 없고 P7에만 CTA 버튼 문구가 있다.
  캡션은 공감→정보→실행 팁→저장 유도 구조에 해시태그 4~8개(#커리어마이징 포함). render_carousel.py로 spec.json을 만들어 PNG를 생성한다.
  '무조건', '모든 면접관', '합격 보장' 같은 단정 표현이 없다.
